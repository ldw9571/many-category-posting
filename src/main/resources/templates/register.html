<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-page">
        <span class="brand">CONTENTLAB</span>
        <h2>고객사 회원가입</h2>
        <p style="color:var(--text-secondary); font-size:14px; margin-bottom:24px;">계정을 만들고 바로 시작해보세요.</p>

        <div class="banner banner-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <form method="post" th:action="@{/register}" th:object="${registerDto}">
            <label>이메일</label>
            <input type="email" th:field="*{email}" placeholder="name@company.com" required>
            <p class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label>비밀번호</label>
            <input type="password" th:field="*{password}" placeholder="8자 이상" required>
            <p class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label>상호명</label>
            <input type="text" th:field="*{businessName}" placeholder="예: OO법무사" required>

            <button type="submit" style="width:100%; justify-content:center;">가입하기</button>
        </form>

        <p class="footer-links">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
    </div>
</body>
</html>
