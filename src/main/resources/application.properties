spring.application.name=biz-content-generator
server.port=8081

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.thymeleaf.encoding=UTF-8

# Gemini API 키 - 환경변수에서만 주입, 절대 여기 직접 값 넣지 말 것
gemini.api.key=${GEMINI_API_KEY:}

# 토큰(네이버 OAuth 등) 암호화 키 - 환경변수에서만 주입, 32바이트(256bit) 랜덤값 사용
security.token-encrypt-key=${TOKEN_ENCRYPT_KEY:}
